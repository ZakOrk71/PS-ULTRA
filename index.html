  <link rel="apple-touch-icon" href='data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 180 180"><defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="%2300ff88"/><stop offset="1" stop-color="%2300d97e"/></linearGradient></defs><rect width="180" height="180" rx="40" fill="black"/><text x="50%" y="62%" font-size="82" text-anchor="middle" fill="url(%23g)" font-family="-apple-system,sans-serif" font-weight="900" letter-spacing="-3">PS</text></svg>'>
  <style>
    * { -webkit-tap-highlight-color: transparent; box-sizing: border-box; }
    html, body {
      margin: 0; padding: 0; background: #000; color: #fff;
      font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', system-ui, sans-serif;
      -webkit-font-smoothing: antialiased; overscroll-behavior: contain;
      min-height: 100vh; min-height: 100dvh;
    }
    input[type="range"] { -webkit-appearance: none; appearance: none; background: transparent; }
    input[type="range"]::-webkit-slider-runnable-track { height: 6px; background: #1a1a24; border-radius: 3px; }
    input[type="range"]::-webkit-slider-thumb {
      -webkit-appearance: none; appearance: none; width: 24px; height: 24px;
      border-radius: 50%; background: #fff; cursor: pointer;
      box-shadow: 0 2px 10px rgba(0,255,136,0.6);
      margin-top: -9px; border: 2px solid #00ff88;
    }
    input[type="text"], input[type="number"] { -webkit-appearance: none; appearance: none; }
    input::placeholder { color: #444; }
    input[type="number"] { -moz-appearance: textfield; }
    input[type="number"]::-webkit-inner-spin-button, input[type="number"]::-webkit-outer-spin-button { -webkit-appearance: none; margin: 0; }
    button { font-family: inherit; }
    @keyframes spin { to { transform: rotate(360deg); } }
    @keyframes fadeOut { 0% { opacity: 1; } 80% { opacity: 1; } 100% { opacity: 0; } }
    #error { display: none; padding: 30px; color: #fca5a5; font-family: monospace; font-size: 12px; white-space: pre-wrap; }
  </style>
</head>
<body>
  <div id="root">
    <div style="display:flex;align-items:center;justify-content:center;min-height:100vh;flex-direction:column;gap:20">
      <div style="width:44px;height:44px;border:3px solid #14141e;border-top-color:#00ff88;border-radius:50%;animation:spin 0.7s linear infinite"></div>
      <div style="color:#00ff88;font-weight:800;letter-spacing:4px;font-size:11px">PS ULTRA</div>
    </div>
  </div>
  <pre id="error"></pre>

  <!-- React depuis CDN -->

  <script src="https://unpkg.com/react-dom@18.2.0/umd/react-dom.production.min.js" crossorigin></script>

  <!-- Le code de l'app (externe) -->
  <script src="app.js"></script>

  <!-- Service Worker pour le mode hors-ligne -->
  <script>
    if ("serviceWorker" in navigator) {
      window.addEventListener("load", function () {
        navigator.serviceWorker.register("sw.js").catch(function (e) {
          console.log("SW non enregistré:", e);
        });
      });
    }
  </script>
